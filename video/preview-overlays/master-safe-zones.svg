<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <title>Arts Educator Pathways — master safe zones, 1080x1920</title>
  <desc>Drop over a 1080x1920 presenter clip at 100% scale, no repositioning. All values measured
  from the live player on 2026-08-10. The picture is pinned to the TOP of the player, so nothing is
  ever cut from the top; everything below is lost from the bottom, and how much depends on the
  screen. The binding rule is y1090: the caption box starts there on the smallest phone, so no part
  of a face may sit below it.</desc>

  <g id="zones">
    <rect x="0" y="1090" width="1080" height="183" fill="#f59e0b" fill-opacity="0.20"/>
    <rect x="0" y="1273" width="1080" height="161" fill="#f59e0b" fill-opacity="0.34"/>
    <rect x="0" y="1434" width="1080" height="418" fill="#ef4444" fill-opacity="0.22"/>
    <rect x="0" y="1852" width="1080" height="68" fill="#ef4444" fill-opacity="0.42"/>
    <rect x="0" y="80" width="1080" height="80" fill="#4ade80" fill-opacity="0.14"/>
  </g>

  <g id="rules" stroke-width="3" fill="none">
    <line x1="0" y1="80" x2="1080" y2="80" stroke="#4ade80" stroke-dasharray="14 10"/>
    <line x1="0" y1="160" x2="1080" y2="160" stroke="#4ade80" stroke-dasharray="14 10"/>
    <line x1="0" y1="1090" x2="1080" y2="1090" stroke="#f59e0b" stroke-width="5"/>
    <line x1="0" y1="1273" x2="1080" y2="1273" stroke="#f59e0b"/>
    <line x1="0" y1="1434" x2="1080" y2="1434" stroke="#ef4444" stroke-width="5"/>
    <line x1="0" y1="1508" x2="1080" y2="1508" stroke="#ffffff" stroke-opacity="0.55" stroke-dasharray="10 12"/>
    <line x1="0" y1="1852" x2="1080" y2="1852" stroke="#ef4444" stroke-dasharray="14 10"/>
    <line x1="540" y1="0" x2="540" y2="1920" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2" stroke-dasharray="10 14"/>
  </g>

  <g id="labels" font-family="Helvetica, Arial, sans-serif" font-weight="700">
    <rect x="20" y="18" width="720" height="48" fill="#001226" fill-opacity="0.85"/>
    <text x="34" y="52" fill="#ffffff" font-size="27">MASTER SAFE ZONES &#183; 1080&#215;1920 &#183; drop at 100%</text>

    <rect x="20" y="172" width="640" height="44" fill="#001226" fill-opacity="0.85"/>
    <text x="34" y="204" fill="#4ade80" font-size="25">TOP OF HEAD &#8212; y80&#8211;160 typical (advisory only)</text>

    <rect x="20" y="1004" width="1040" height="80" fill="#001226" fill-opacity="0.85"/>
    <text x="34" y="1038" fill="#ffffff" font-size="27">FACE ZONE &#8212; KEEP CHIN ABOVE THE ORANGE LINE</text>
    <text x="34" y="1070" fill="#9fb6cf" font-size="23">Everything above y1090 is clear on every screen.</text>

    <rect x="20" y="1100" width="1040" height="44" fill="#001226" fill-opacity="0.85"/>
    <text x="34" y="1132" fill="#f59e0b" font-size="25">y1090 &#8212; CAPTION BOX STARTS (small phone, two-line cue)</text>

    <rect x="20" y="1283" width="1040" height="44" fill="#001226" fill-opacity="0.85"/>
    <text x="34" y="1315" fill="#f59e0b" font-size="25">y1273 &#8212; SKIP / CC / SPEED / MUTE ROW (small phone, captions off)</text>

    <rect x="20" y="1444" width="1040" height="44" fill="#001226" fill-opacity="0.85"/>
    <text x="34" y="1476" fill="#ef4444" font-size="25">y1434 &#8212; PICTURE ENDS on a small phone (375&#215;667)</text>

    <rect x="20" y="1518" width="1040" height="44" fill="#001226" fill-opacity="0.85"/>
    <text x="34" y="1550" fill="#ffffff" font-size="25">y1508 &#8212; caption box on a tall phone; y1554 on desktop</text>

    <rect x="20" y="1862" width="1040" height="44" fill="#001226" fill-opacity="0.85"/>
    <text x="34" y="1894" fill="#ef4444" font-size="25">y1852 &#8212; PICTURE ENDS on a tall phone (375&#215;812). Desktop shows all 1920.</text>

    <rect x="20" y="1600" width="1040" height="200" fill="#001226" fill-opacity="0.85"/>
    <text x="34" y="1636" fill="#ffffff" font-size="24">NOTHING IS EVER CUT FROM THE TOP &#8212; the picture is pinned to the top of</text>
    <text x="34" y="1668" fill="#ffffff" font-size="24">the player, so headroom cannot clip a head. The head band above is for</text>
    <text x="34" y="1700" fill="#ffffff" font-size="24">consistency between presenters, nothing more.</text>
    <text x="34" y="1740" fill="#ffd166" font-size="24">FULL-FRAME GRAPHICS: end the text above y1090. Captions run over them</text>
    <text x="34" y="1772" fill="#ffd166" font-size="24">in Spanish even where the English track is silent.</text>
  </g>
</svg>
